<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StockSync – Smart Stock Tracking</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e7ef;--pr:#4f46e5;--prl:#eef0ff;--ok:#059669;--okl:#d1fae5;--wa:#d97706;--wal:#fef3c7;--er:#e11d48;--erl:#ffe4e6}
body.dark{--bg:#0b1120;--card:#141c2f;--tx:#e8ecf5;--mu:#94a3b8;--bd:#25304a;--prl:#232a55;--okl:#0f3b2e;--wal:#3d2f0c;--erl:#4a1423}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);margin-top:4px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:10px}
.btn{background:var(--pr);color:#fff;border:0;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.del{background:var(--erl);color:var(--er)}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:32px;width:100%;max-width:380px}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:18px}
.logo i{background:var(--pr);color:#fff;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-style:normal}
.err{color:var(--er);font-size:13px;min-height:18px;margin:6px 0}
.hint{font-size:12px;color:var(--mu);margin-top:14px}
aside{position:fixed;inset:0 auto 0 0;width:220px;background:var(--card);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:4px;z-index:20;transition:transform .2s}
aside nav{display:flex;flex-direction:column;gap:4px;margin-top:18px;flex:1}
aside a{color:var(--mu);text-decoration:none;padding:10px 12px;border-radius:10px;font-weight:500}
aside a.on{background:var(--prl);color:var(--pr)}
.me{display:flex;gap:10px;align-items:center;padding:10px;background:var(--bg);border-radius:12px;cursor:pointer;border:0;width:100%;text-align:left}
.av{width:32px;height:32px;border-radius:50%;background:var(--prl);color:var(--pr);display:grid;place-items:center;font-weight:700;font-size:12px}
.top{margin-left:220px;display:flex;gap:10px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:10}
.top input{flex:1;max-width:420px;margin:0}
.top .sp{flex:1}
.ib{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:10px;width:38px;height:38px;cursor:pointer}
.ib b{position:absolute;top:-6px;right:-6px;background:var(--er);color:#fff;border-radius:9px;font-size:10px;padding:1px 5px}
#menu{display:none}
.nw{position:relative}
#np{position:absolute;right:0;top:46px;width:340px;max-width:92vw;max-height:70vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 12px 32px #0003;z-index:30}
#np .nh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd)}
#np .nh button,#np .nf button{background:none;border:0;color:var(--pr);cursor:pointer;font-weight:600;font-size:12px}
#np .ni{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
#np .ni.new{background:var(--prl)}
#np .ni div{flex:1}#np .ni small{color:var(--mu);display:block}
#np .nt{padding:8px 16px;font-size:11px;font-weight:700;color:var(--mu);text-transform:uppercase}
#np .nf{padding:10px;text-align:center}
main{margin-left:220px;padding:24px;max-width:1200px}
h1{font-size:24px}.sub{color:var(--mu);margin:2px 0 18px}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.g2b{grid-template-columns:1fr 1fr}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
.grid .card{margin:0}
.stat b{font-size:26px;display:block;margin-top:8px}.stat span{color:var(--mu)}
.pill{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;background:var(--okl);color:var(--ok)}
.pill.w{background:var(--wal);color:var(--wa)}.pill.e{background:var(--erl);color:var(--er)}
.tip{background:#0f172a;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px}
.tip h2{font-size:22px}.tip p{color:#cbd5e1}.tip a{color:#fff;font-weight:600}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.row.end{justify-content:flex-end}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li small{color:var(--mu);display:block}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mu);font-size:12px;font-weight:600}th,td{padding:11px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.bar{height:8px;background:var(--prl);border-radius:6px;min-width:120px}.bar i{display:block;height:100%;background:var(--pr);border-radius:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.tools select,.tools input{width:auto;margin:0}
dialog{margin:auto;border:1px solid var(--bd);border-radius:16px;padding:24px;width:min(440px,92vw);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}dialog h3{margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mu);padding:20px;text-align:center}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.open{transform:none}.top,main{margin-left:0}#menu{display:block}.g4,.g2,.g2b{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g4,.g2b{grid-template-columns:1fr}main{padding:16px}}
</style>
</head>
<body>
<div id="login">
 <form class="lbox" id="lform">
  <div class="logo"><i>▮</i>StockSync</div>
  <p class="sub" style="margin-bottom:18px">Smart inventory for small clothing businesses</p>
  <label>Email<input type="email" id="le" required></label>
  <label>Password<input type="password" id="lp" required></label>
  <p class="err" id="lerr"></p>
  <button class="btn" style="width:100%">Log in</button>
  <p class="hint">Demo account: john@stocksync.com / tsm3b</p>
 </form>
</div>

<div id="app" hidden>
 <aside id="side">
  <div class="logo"><i>▮</i><div>StockSync<small style="display:block;font-size:11px;color:var(--mu);font-weight:400">Smart inventory</small></div></div>
  <nav>
   <a href="#dashboard">▦ Dashboard</a><a href="#inventory">◈ Inventory</a><a href="#orders">🛒 Orders</a>
   <a href="#reports">▥ Reports</a><a href="#suppliers">☺ Suppliers</a><a href="#settings">⚙ Settings</a>
  </nav>
  <button class="me" data-act="logout" title="Log out"><span class="av" id="av"></span><span><b id="mn"></b><small style="display:block;color:var(--mu)">Click to log out</small></span></button>
 </aside>
 <div class="top">
  <button class="ib" id="menu" data-act="menu">☰</button>
  <input id="q" placeholder="Search products, SKU…">
  <span class="sp"></span>
  <button class="ib" data-act="theme" title="Toggle theme">◐</button>
  <div class="nw"><button class="ib" data-act="bell" title="Notifications">🔔<b id="bc"></b></button><div id="np" hidden></div></div>
  <button class="btn" data-act="add-prod">+ Add product</button>
 </div>
 <main id="view"></main>
</div>

<dialog id="dlg"><form id="dform"></form></dialog>

<script>
const CUR='₱';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>CUR+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const dk=d=>new Date(d).toLocaleDateString('en-CA');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);

let db={theme:localStorage.getItem('ss_theme')||'light',user:{},store:{name:'',owner:''},products:[],orders:[],suppliers:[],activity:[]};
let _in=false;
async function api(url,method='GET',body){
  const r=await fetch('/api'+url,{method,headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&url!=='/state'&&url!=='/login'){_in=false;$('#login').hidden=false;$('#app').hidden=true}
  if(!r.ok)throw new Error(j.error||'Request failed');
  if(j.products)Object.assign(db,j);
  return j;
}
const act=(url,m,b)=>api(url,m,b).then(()=>render()).catch(e=>alert(e.message));
const st={range:7,rrange:30,filter:'all',q:''};
const low=p=>p.qty<=p.thr;
const ago=t=>{const m=Math.floor((Date.now()-t)/60000);return m<1?'just now':m<60?m+' min':m<1440?Math.floor(m/60)+' hr':Math.floor(m/1440)+' d'};
const sold=(days)=>{const m={},lim=Date.now()-days*864e5;db.orders.forEach(o=>{if(!days||+new Date(o.date)>=lim)o.items.forEach(i=>m[i.pid]=(m[i.pid]||0)+i.qty)});return m};

/* ---------- auth ---------- */
const authed=()=>_in;
$('#lform').onsubmit=async e=>{e.preventDefault();
  try{await api('/login','POST',{email:$('#le').value,password:$('#lp').value});$('#lerr').textContent='';location.hash='#dashboard';boot()}
  catch(err){$('#lerr').textContent=err.message}};
async function boot(){
  document.body.classList.toggle('dark',db.theme==='dark');
  try{await api('/state');_in=true}catch(e){_in=false}
  $('#login').hidden=_in;$('#app').hidden=!_in;
  if(_in)render();
}

/* ---------- modal ---------- */
const fld=(l,n,v='',t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x} required></label>`;
function modal(title,body,ok,btn='Save'){
  $('#dform').innerHTML=`<h3>${title}</h3>${body}<p class="err" id="merr"></p><div class="row end"><button type="button" class="btn ghost" data-act="close">Cancel</button><button class="btn">${btn}</button></div>`;
  $('#dform').onsubmit=async e=>{e.preventDefault();try{await ok(Object.fromEntries(new FormData(e.target)))}catch(err){$('#merr').textContent=err.message;return}$('#dlg').close();render()};
  $('#dlg').showModal();
}
function prodModal(id){
  const p=db.products.find(x=>x.id===id)||{name:'',sku:'',size:'M',color:'',qty:0,price:0,thr:10};
  modal(id?'Edit product':'Add product',fld('Product name','name',p.name)+`<div class="two">${fld('SKU','sku',p.sku)}${fld('Size','size',p.size)}${fld('Color','color',p.color)}${fld('Quantity','qty',p.qty,'number','min=0')}${fld('Price ('+CUR+')','price',p.price,'number','min=0 step=0.01')}${fld('Reorder threshold','thr',p.thr,'number','min=0')}</div>`,f=>api('/products','POST',{id:id||undefined,...f}));
}
function orderModal(){
  if(!db.products.length)return alert('Add a product first.');
  const opts=db.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.size)}/${esc(p.color)}) – ${p.qty} in stock</option>`).join('');
  const line=`<div class="two line" style="grid-template-columns:2fr 1fr"><label>Product<select name="pid">${opts}</select></label><label>Qty<input name="oq" type="number" min="1" value="1" required></label></div>`;
  modal('Record new order',`<div id="lines">${line}</div><button type="button" class="btn ghost sm" data-act="addline" style="margin-bottom:12px">+ Add another item</button>`,f=>{const ids=[].map.call(document.querySelectorAll('#dform [name=pid]'),x=>x.value),qs=[].map.call(document.querySelectorAll('#dform [name=oq]'),x=>+x.value);return api('/orders','POST',{items:ids.map((pid,i)=>({pid,qty:qs[i]}))})},'Save order');
  window._line=line;
}
function supModal(id){
  const s=db.suppliers.find(x=>x.id===id)||{name:'',contact:'',email:'',products:''};
  modal(id?'Edit supplier':'Add supplier',fld('Supplier name','name',s.name)+fld('Contact person','contact',s.contact)+fld('Email / phone','email',s.email)+fld('Products supplied','products',s.products),f=>api('/suppliers','POST',{id:id||undefined,...f}));
}

/* ---------- pages ---------- */
const pages={
dashboard(){
  const inv=db.products.reduce((t,p)=>t+p.qty*p.price,0),lows=db.products.filter(low).sort((a,b)=>a.qty-b.qty);
  const mo=db.orders.filter(o=>+new Date(o.date)>Date.now()-30*864e5).length;
  const days=[];for(let i=st.range-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  const vals=days.map(d=>db.orders.filter(o=>dk(o.date)===dk(d)).reduce((t,o)=>t+o.total,0)),tot=vals.reduce((a,b)=>a+b,0);
  const W=600,H=180,mx=Math.max(...vals,1),pts=vals.map((v,i)=>[i*W/(vals.length-1),H-10-v/mx*(H-30)]);
  const line=pts.map(p=>p.join(',')).join(' ');
  const lab=days.map((d,i)=>(st.range===7||i%5===0)?`<text x="${pts[i][0]}" y="${H+16}" font-size="11" fill="var(--mu)" text-anchor="middle">${st.range===7?d.toLocaleDateString('en',{weekday:'short'}):d.getDate()}</text>`:'').join('');
  const s7=sold(7);let tip='Record some orders to unlock sales-based restock tips.';
  const best=db.products.filter(p=>s7[p.id]).sort((a,b)=>s7[b.id]/(b.qty+1)-s7[a.id]/(a.qty+1))[0];
  if(best)tip=`${esc(best.name)} sold ${s7[best.id]} units this week and only ${best.qty} remain. Restock now to avoid missing sales.`;
  const h=new Date().getHours();
  return`<h1>Good ${h<12?'morning':h<18?'afternoon':'evening'}, ${esc(db.store.owner)}</h1><p class="sub">Here's what's happening with your inventory today. · ${new Date().toDateString()}</p>
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card stat"><span>Total products</span><b>${db.products.length}</b><small class="pill">${db.products.reduce((t,p)=>t+p.qty,0)} units</small></div>
   <div class="card stat"><span>Inventory value</span><b>${money(inv)}</b></div>
   <div class="card stat"><span>Low stock items</span><b>${lows.length}</b>${lows.length?'<small class="pill w">Needs attention</small>':''}</div>
   <div class="card stat"><span>Orders this month</span><b>${mo}</b></div></div>
  <div class="grid g2" style="margin-bottom:16px">
   <div class="card"><div class="row"><div><b>Sales overview</b><p class="sub" style="margin:0">Revenue performance</p></div>
    <select data-sel="range" style="width:auto"><option value="7" ${st.range==7?'selected':''}>Last 7 days</option><option value="30" ${st.range==30?'selected':''}>Last 30 days</option></select></div>
    <p style="font-size:26px;font-weight:700;margin:10px 0">${money(tot)}</p>
    <svg viewBox="-10 0 ${W+20} ${H+24}" width="100%"><polygon points="0,${H} ${line} ${W},${H}" fill="var(--prl)"/><polyline points="${line}" fill="none" stroke="var(--pr)" stroke-width="3" stroke-linejoin="round"/>${lab}</svg></div>
   <div class="card tip"><span class="pill" style="width:fit-content;background:#1e293b;color:#cbd5e1">SMART TIP</span><h2>Stock smarter, sell more.</h2><p>${tip}</p><a href="#inventory">Go to inventory →</a></div></div>
  <div class="grid g2b"><div class="card"><div class="row"><b>Low stock</b><a href="#inventory" data-act="lowview" style="color:var(--pr)">View all</a></div>
   ${lows.slice(0,4).map(p=>`<div class="li"><div>${esc(p.name)}<small>${esc(p.sku)}</small></div><div style="text-align:right"><b style="color:var(--er)">${p.qty} left</b><small>Reorder at ${p.thr}</small></div><button class="btn ghost sm" data-act="restock" data-id="${p.id}" title="Add 10 units">+10</button></div>`).join('')||'<p class="empty">All items are well stocked 🎉</p>'}</div>
   <div class="card"><b>Recent activity</b>${db.activity.slice(0,5).map(a=>`<div class="li"><div>${esc(a.msg)}<small>${esc(a.sub||'')}</small></div><small>${ago(a.t)}</small></div>`).join('')}</div></div>`;
},
inventory(){
  const q=st.q.toLowerCase();
  const L=db.products.filter(p=>(st.filter==='all'||low(p))&&(p.name+p.sku+p.color).toLowerCase().includes(q));
  return`<div class="row"><div><h1>Inventory</h1><p class="sub">Manage products by size, color and quantity.</p></div><button class="btn" data-act="add-prod">+ Add product</button></div>
  <div class="tools"><select data-sel="filter"><option value="all">All products</option><option value="low" ${st.filter=='low'?'selected':''}>Low stock only</option></select><button class="btn ghost" data-act="csv">Export CSV</button></div>
  <div class="card scroll"><table><tr><th>Product</th><th>SKU</th><th>Size</th><th>Color</th><th>Qty</th><th>Price</th><th>Status</th><th></th></tr>
  ${L.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${esc(p.size)}</td><td>${esc(p.color)}</td><td><b>${p.qty}</b></td><td>${money(p.price)}</td>
   <td>${p.qty===0?'<span class="pill e">Out of stock</span>':low(p)?'<span class="pill w">Low stock</span>':'<span class="pill">In stock</span>'}</td>
   <td><button class="btn ghost sm" data-act="restock" data-id="${p.id}">+10</button> <button class="btn ghost sm" data-act="edit-prod" data-id="${p.id}">Edit</button> <button class="btn del sm" data-act="del-prod" data-id="${p.id}">Delete</button></td></tr>`).join('')||`<tr><td colspan="8" class="empty">No products found.</td></tr>`}</table></div>`;
},
orders(){
  const nm=id=>(db.products.find(p=>p.id===id)||{name:'(deleted product)'}).name;
  return`<div class="row"><div><h1>Orders</h1><p class="sub">Recording an order automatically deducts stock.</p></div><button class="btn" data-act="new-order">+ New order</button></div>
  <div class="card scroll"><table><tr><th>Order</th><th>Date</th><th>Items</th><th>Total</th></tr>
  ${[...db.orders].reverse().slice(0,60).map(o=>`<tr><td><b>#${o.id}</b></td><td>${new Date(o.date).toLocaleString()}</td><td style="white-space:normal">${o.items.map(i=>esc(nm(i.pid))+' ×'+i.qty).join(', ')}</td><td>${money(o.total)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No orders yet.</td></tr>'}</table></div>`;
},
reports(){
  const m=sold(st.rrange),R=db.products.map(p=>({p,u:m[p.id]||0})).sort((a,b)=>b.u-a.u),mx=Math.max(1,...R.map(r=>r.u)),avg=R.reduce((t,r)=>t+r.u,0)/(R.length||1);
  const rev=db.orders.filter(o=>!st.rrange||+new Date(o.date)>Date.now()-st.rrange*864e5);
  return`<div class="row"><div><h1>Reports</h1><p class="sub">Fast-moving vs. slow-moving products.</p></div>
  <select data-sel="rrange" style="width:auto"><option value="7" ${st.rrange==7?'selected':''}>Last 7 days</option><option value="30" ${st.rrange==30?'selected':''}>Last 30 days</option><option value="0" ${!st.rrange?'selected':''}>All time</option></select></div>
  <div class="grid g4" style="margin-bottom:16px"><div class="card stat"><span>Orders</span><b>${rev.length}</b></div><div class="card stat"><span>Revenue</span><b>${money(rev.reduce((t,o)=>t+o.total,0))}</b></div><div class="card stat"><span>Units sold</span><b>${R.reduce((t,r)=>t+r.u,0)}</b></div><div class="card stat"><span>Best seller</span><b style="font-size:16px">${R[0]&&R[0].u?esc(R[0].p.name):'—'}</b></div></div>
  <div class="card scroll"><table><tr><th>Product</th><th>Units sold</th><th></th><th>Movement</th><th>In stock</th></tr>
  ${R.map(r=>`<tr><td>${esc(r.p.name)}</td><td><b>${r.u}</b></td><td><div class="bar"><i style="width:${r.u/mx*100}%"></i></div></td><td>${r.u===0?'<span class="pill e">No sales</span>':r.u>=avg?'<span class="pill">Fast-moving</span>':'<span class="pill w">Slow-moving</span>'}</td><td>${r.p.qty}</td></tr>`).join('')}</table></div>`;
},
suppliers(){
  return`<div class="row"><div><h1>Suppliers</h1><p class="sub">Keep supplier details in one place.</p></div><button class="btn" data-act="add-sup">+ Add supplier</button></div>
  <div class="card scroll"><table><tr><th>Supplier</th><th>Contact</th><th>Email / phone</th><th>Products supplied</th><th></th></tr>
  ${db.suppliers.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.contact)}</td><td>${esc(s.email)}</td><td>${esc(s.products)}</td><td><button class="btn ghost sm" data-act="edit-sup" data-id="${s.id}">Edit</button> <button class="btn del sm" data-act="del-sup" data-id="${s.id}">Delete</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No suppliers yet.</td></tr>'}</table></div>`;
},
settings(){
  return`<h1>Settings</h1><p class="sub">Business information and account.</p>
  <div class="grid g2b"><form class="card" id="sform"><b>Business information</b><br><br>${fld('Store name','name',db.store.name)}${fld('Owner first name','owner',db.store.owner)}${fld('Address','address',db.store.address)}<button class="btn">Save</button></form>
  <form class="card" id="pform"><b>Account</b><br><br>${fld('Email','email',db.user.email,'email')}${fld('New password','pass','','password','minlength=6')}<button class="btn">Update account</button><p class="hint" id="pmsg"></p>
  <hr style="border:0;border-top:1px solid var(--bd);margin:18px 0"><button type="button" class="btn del" data-act="reset">Reset demo data</button></form></div>`;
}};

function render(){
  const r=(location.hash.slice(1)||'dashboard');const pg=pages[r]?r:'dashboard';
  $('#view').innerHTML=pages[pg]();
  document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+pg));
  notif();
  $('#mn').textContent=db.store.name;$('#av').textContent=db.store.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  $('#side').classList.remove('open');
  const sf=$('#sform');if(sf)sf.onsubmit=e=>{e.preventDefault();api('/settings','POST',Object.fromEntries(new FormData(sf))).then(()=>{render();alert('Saved!')}).catch(e=>alert(e.message))};
  const pf=$('#pform');if(pf)pf.onsubmit=e=>{e.preventDefault();api('/account','POST',Object.fromEntries(new FormData(pf))).then(()=>{$('#pmsg').textContent='Account updated.'}).catch(e=>{$('#pmsg').textContent=e.message})};
}
window.onhashchange=()=>authed()&&render();

/* ---------- notifications ---------- */
const seen=()=>JSON.parse(localStorage.getItem('ss_seen')||'[]');
const alerts=()=>db.products.filter(low).sort((a,b)=>a.qty-b.qty).map(p=>({p,key:p.id+':'+p.qty}));
function notif(){
  const A=alerts(),sn=seen(),unread=A.filter(a=>!sn.includes(a.key)).length;
  $('#bc').textContent=unread||'';$('#bc').hidden=!unread;
  if($('#np').hidden)return;
  $('#np').innerHTML=`<div class="nh"><b>Notifications</b><button data-act="readall">Mark all as read</button></div>
  <div class="nt">Stock alerts (${A.length})</div>
  ${A.map(a=>`<div class="ni ${sn.includes(a.key)?'':'new'}"><span>${a.p.qty===0?'⛔':'⚠️'}</span><div>${esc(a.p.name)}<small>${a.p.qty===0?'Out of stock':'Only '+a.p.qty+' left'} · reorder at ${a.p.thr}</small></div><button class="btn ghost sm" data-act="restock" data-id="${a.p.id}">+10</button></div>`).join('')||'<p class="empty">No stock alerts. All good! 🎉</p>'}
  <div class="nt">Recent activity</div>
  ${db.activity.slice(0,4).map(x=>`<div class="ni"><div>${esc(x.msg)}<small>${esc(x.sub||'')} · ${ago(x.t)}</small></div></div>`).join('')}
  <div class="nf"><button data-act="lowview">View all low-stock items →</button></div>`;
}
document.addEventListener('click',e=>{if(!e.target.closest('.nw'))$('#np').hidden=true});

/* ---------- events ---------- */
$('#q').oninput=e=>{st.q=e.target.value;if(location.hash!=='#inventory')location.hash='#inventory';else render()};
document.addEventListener('change',e=>{const k=e.target.dataset.sel;if(k){st[k]=k==='filter'?e.target.value:+e.target.value;render()}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='close')$('#dlg').close();
  else if(a==='menu')$('#side').classList.toggle('open');
  else if(a==='theme'){db.theme=db.theme==='dark'?'light':'dark';localStorage.setItem('ss_theme',db.theme);document.body.classList.toggle('dark',db.theme==='dark')}
  else if(a==='logout')api('/logout','POST').then(()=>boot());
  else if(a==='bell'){$('#np').hidden=!$('#np').hidden;notif()}
  else if(a==='readall'){localStorage.setItem('ss_seen',JSON.stringify(alerts().map(x=>x.key)));notif()}
  else if(a==='lowview'){$('#np').hidden=true;st.filter='low';st.q='';$('#q').value='';location.hash='#inventory';render()}
  else if(a==='add-prod')prodModal();
  else if(a==='edit-prod')prodModal(id);
  else if(a==='del-prod'){const p=db.products.find(x=>x.id===id);if(confirm('Delete '+p.name+'?'))act('/products/'+id,'DELETE')}
  else if(a==='restock')act('/products/'+id+'/restock','POST');
  else if(a==='new-order')orderModal();
  else if(a==='addline')$('#lines').insertAdjacentHTML('beforeend',window._line);
  else if(a==='add-sup')supModal();
  else if(a==='edit-sup')supModal(id);
  else if(a==='del-sup'){if(confirm('Delete this supplier?'))act('/suppliers/'+id,'DELETE')}
  else if(a==='csv'){const rows=[['Name','SKU','Size','Color','Qty','Price','Threshold'],...db.products.map(p=>[p.name,p.sku,p.size,p.color,p.qty,p.price,p.thr])];
    const url=URL.createObjectURL(new Blob([rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));
    Object.assign(document.createElement('a'),{href:url,download:'stocksync-inventory.csv'}).click()}
  else if(a==='reset'){if(confirm('Reset all data to the demo set?'))api('/reset','POST').then(()=>render())}
});
boot();
</script>
</body>
</html>
